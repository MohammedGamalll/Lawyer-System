name: Publish Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and attach the installer to
        required: true
        default: v1.0.9

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and rebuild native modules
        run: |
          npm ci
          npm run rebuild

      - name: Build NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Prepare hyphenated installer and latest.yml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -LiteralPath release -Filter "Law Office Management System-Setup-*.exe" |
            Where-Object { $_.Extension -eq '.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Installer not found in release/" }

          $fileName = $exe.Name -replace ' ', '-'
          $hyphen = Join-Path $exe.DirectoryName $fileName
          Copy-Item -LiteralPath $exe.FullName -Destination $hyphen -Force

          $blockSrc = "$($exe.FullName).blockmap"
          $blockDst = "$hyphen.blockmap"
          if (Test-Path -LiteralPath $blockSrc) {
            Copy-Item -LiteralPath $blockSrc -Destination $blockDst -Force
          }

          $ymlPath = Join-Path $exe.DirectoryName 'latest.yml'
          if (-not (Test-Path -LiteralPath $ymlPath)) { throw 'electron-builder did not write release/latest.yml' }
          $yml = Get-Content -LiteralPath $ymlPath -Raw
          Set-Content -LiteralPath $ymlPath -Value ($yml -replace [regex]::Escape($exe.Name), $fileName).TrimEnd() -Encoding ascii

          Write-Host "Prepared $fileName size=$((Get-Item -LiteralPath $hyphen).Length)"
          Get-Content -LiteralPath $ymlPath

      - name: Keep installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: |
            release/Law-Office-Management-System-Setup-*.exe
            release/Law-Office-Management-System-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ inputs.tag }}'
          $exe = Get-ChildItem -LiteralPath release -Filter 'Law-Office-Management-System-Setup-*.exe' |
            Where-Object { $_.Extension -eq '.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'Hyphenated installer not found' }
          $fileName = $exe.Name
          $ymlPath = Join-Path $exe.DirectoryName 'latest.yml'
          $blockDst = "$($exe.FullName).blockmap"

          Write-Host "Uploading $($exe.FullName) ($((Get-Item -LiteralPath $exe.FullName).Length) bytes)"
          gh release upload $tag $exe.FullName --clobber --repo $env:GITHUB_REPOSITORY
          gh release upload $tag $ymlPath --clobber --repo $env:GITHUB_REPOSITORY
          if (Test-Path -LiteralPath $blockDst) {
            gh release upload $tag $blockDst --clobber --repo $env:GITHUB_REPOSITORY
          }

          function Get-ExeAsset {
            $rel = gh api "repos/$($env:GITHUB_REPOSITORY)/releases/tags/$tag" | ConvertFrom-Json
            return $rel.assets | Where-Object { $_.name -eq $fileName }
          }

          $asset = Get-ExeAsset
          if (-not $asset) { throw 'Installer asset missing immediately after upload' }
          $expected = (Get-Item -LiteralPath $exe.FullName).Length
          Write-Host "Uploaded asset id=$($asset.id) size=$($asset.size) state=$($asset.state)"
          if ($asset.size -ne $expected) { throw "Size mismatch GitHub=$($asset.size) local=$expected" }

          Start-Sleep -Seconds 45
          $again = Get-ExeAsset
          if (-not $again) { throw 'Installer asset disappeared 45s after upload' }
          Write-Host "Confirmed still present after 45s size=$($again.size)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
